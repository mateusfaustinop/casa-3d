<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Casa Moderna - Tour 3D Mobile</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      background: rgba(10, 10, 10, 0.58);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      pointer-events: auto;
    }
    .panel h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
    }
    .panel p {
      margin: 2px 0;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(255,255,255,0.88);
    }
    .toolbar, .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 520px;
    }
    button {
      pointer-events: auto;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    button:active, button.active {
      background: rgba(255,255,255,0.24);
      transform: scale(0.98);
    }
    #nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 12px;
      z-index: 10;
      pointer-events: none;
    }
    .pad, .turnPad {
      display: grid;
      gap: 8px;
      pointer-events: auto;
      user-select: none;
    }
    .pad {
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
    }
    .turnPad {
      grid-template-columns: 72px 72px;
      grid-template-rows: 64px 64px;
      align-self: flex-end;
    }
    .ctrl {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: rgba(10, 10, 10, 0.58);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      pointer-events: auto;
    }
    .empty { opacity: 0; pointer-events: none; }
    #status {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,10,0.58);
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    @media (max-width: 900px) {
      #hud {
        flex-direction: column;
      }
      .panel h1 {
        font-size: 15px;
      }
      .panel p {
        font-size: 11px;
      }
      .toolbar, .presets {
        max-width: none;
      }
      button {
        padding: 9px 12px;
        font-size: 12px;
      }
      #status {
        bottom: 228px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="panel">
      <h1>Casa Moderna — Tour 3D</h1>
      <p>Modelo conceitual navegável para celular, baseado na planta e nas imagens criadas.</p>
      <p>Arraste a tela para olhar ao redor. Use os controles abaixo para caminhar.</p>
    </div>

    <div class="panel">
      <div class="toolbar">
        <button id="roofBtn">Ocultar cobertura</button>
        <button id="resetBtn">Vista inicial</button>
        <button id="orbitBtn">Modo órbita: ON</button>
      </div>
      <div class="presets" style="margin-top:8px;">
        <button data-view="entrada">Entrada</button>
        <button data-view="sala">Sala</button>
        <button data-view="cozinha">Cozinha</button>
        <button data-view="suite">Suíte</button>
        <button data-view="gourmet">Área gourmet</button>
        <button data-view="banho">Banheiro suíte</button>
        <button data-view="planta">Vista superior</button>
      </div>
    </div>
  </div>

  <div id="nav">
    <div class="pad">
      <div class="empty"></div>
      <div class="ctrl" data-hold="forward">▲</div>
      <div class="empty"></div>
      <div class="ctrl" data-hold="left">◀</div>
      <div class="ctrl" data-hold="back">▼</div>
      <div class="ctrl" data-hold="right">▶</div>
      <div class="empty"></div>
      <div class="ctrl" data-hold="up">＋</div>
      <div class="ctrl" data-hold="down">－</div>
    </div>

    <div class="turnPad">
      <div class="ctrl" data-hold="turnLeft">↺</div>
      <div class="ctrl" data-hold="turnRight">↻</div>
      <div class="ctrl" data-hold="lookUp">⬆</div>
      <div class="ctrl" data-hold="lookDown">⬇</div>
    </div>
  </div>

  <div id="status">Ambiente: entrada</div>

  <script>
    // Show a readable message instead of a black screen if a module/CDN fails.
    window.addEventListener('error', function (e) {
      const app = document.getElementById('app');
      if (app && !app.dataset.ready) {
        app.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:#111;color:white;font:16px -apple-system,Arial;text-align:center"><div><b>Falha ao carregar o motor 3D.</b><br><br>Atualize a página com internet ativa. Se persistir, avise o erro: '+ String(e.message || 'módulo 3D') +'</div></div>';
      }
    });
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe4f5);
    scene.fog = new THREE.Fog(0xcfe4f5, 42, 95);

    const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, -18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);
    app.dataset.ready = '1';

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 0.1;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.set(0, 2.1, -5);
    controls.update();

    let orbitEnabled = true;

    const house = new THREE.Group();
    scene.add(house);

    const roofGroup = new THREE.Group();
    house.add(roofGroup);

    // Materials
    const matGround = new THREE.MeshStandardMaterial({ color: 0x6f726d, roughness: 0.96 });
    const matStreet = new THREE.MeshStandardMaterial({ color: 0x3b3a3c, roughness: 0.94 });
    const matWall = new THREE.MeshStandardMaterial({ color: 0xe8e0d4, roughness: 0.95 });
    const matAccent = new THREE.MeshStandardMaterial({ color: 0x1e2126, roughness: 0.7 });
    const matWood = new THREE.MeshStandardMaterial({ color: 0x7d573c, roughness: 0.78 });
    const matGlass = new THREE.MeshPhysicalMaterial({ color: 0xd7ecff, transmission: 0.8, opacity: 0.22, transparent: true, roughness: 0.08, metalness: 0.0 });
    const matStone = new THREE.MeshStandardMaterial({ color: 0xd5c8b4, roughness: 0.9 });
    const matIndoorFloor = new THREE.MeshStandardMaterial({ color: 0xdfd7ca, roughness: 0.93 });
    const matOutdoorFloor = new THREE.MeshStandardMaterial({ color: 0xcdc6bc, roughness: 0.95 });
    const matBlackMarble = new THREE.MeshStandardMaterial({ color: 0x131416, roughness: 0.35, metalness: 0.15 });
    const matFabric = new THREE.MeshStandardMaterial({ color: 0xd8cfbf, roughness: 1.0 });
    const matGreen = new THREE.MeshStandardMaterial({ color: 0x2f5d34, roughness: 1.0 });
    const matWater = new THREE.MeshStandardMaterial({ color: 0x8eb0be, roughness: 0.35, metalness: 0.05 });
    const matMetal = new THREE.MeshStandardMaterial({ color: 0x2f3135, roughness: 0.35, metalness: 0.75 });
    const matCarGrey = new THREE.MeshStandardMaterial({ color: 0x6f736f, roughness: 0.32, metalness: 0.5 });
    const matCarBlue = new THREE.MeshStandardMaterial({ color: 0x18375f, roughness: 0.28, metalness: 0.55 });
    const matCarGlass = new THREE.MeshPhysicalMaterial({ color: 0x8ea3b7, transmission: 0.6, opacity: 0.4, transparent: true, roughness: 0.05 });

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0xa7b19a, 1.2);
    hemi.position.set(0, 25, 0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3dc, 1.8);
    sun.position.set(-18, 26, -14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -25;
    sun.shadow.camera.right = 25;
    sun.shadow.camera.top = 25;
    sun.shadow.camera.bottom = -25;
    scene.add(sun);

    const warmLightPositions = [
      [-6, 2.7, -1], [-1, 2.7, -1], [4, 2.7, -1],
      [-2, 2.7, 3], [3, 2.7, 6], [-4, 2.6, 6],
      [-2, 2.5, 10], [3, 2.4, 10], [-4.5, 2.5, 10.8], [1.5, 2.5, 12.2]
    ];
    warmLightPositions.forEach(([x,y,z]) => {
      const l = new THREE.PointLight(0xffd9aa, 0.48, 7, 2);
      l.position.set(x, y, z);
      scene.add(l);
    });

    // Helpers
    function box(w,h,d,mat,x,y,z,group=house, shadow=true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
      mesh.position.set(x,y,z);
      mesh.castShadow = shadow;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }
    function plane(w,d,mat,x,y,z,rx=-Math.PI/2,group=house) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat);
      mesh.rotation.x = rx;
      mesh.position.set(x,y,z);
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }
    function cylinder(rt,rb,h,mat,x,y,z,group=house, shadow=true) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20), mat);
      mesh.position.set(x,y,z);
      mesh.castShadow = shadow;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }
    function addWall(x1,z1,x2,z2,height=2.9,thick=0.18,mat=matWall,group=house) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(len, height, thick), mat);
      mesh.position.set((x1+x2)/2, height/2, (z1+z2)/2);
      mesh.rotation.y = Math.atan2(dz, dx);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }
    function addRug(w,d,x,z,color=0xcfc4b3) {
      return box(w, 0.03, d, new THREE.MeshStandardMaterial({ color, roughness: 1.0 }), x, 0.02, z, house, false);
    }
    function addPlant(x,z,scale=1) {
      const g = new THREE.Group();
      const pot = cylinder(0.16*scale,0.19*scale,0.24*scale,new THREE.MeshStandardMaterial({ color: 0x9b9b95, roughness: 0.9 }),0,0.12*scale,0,g,false);
      for (let i=0;i<6;i++) {
        const leaf = new THREE.Mesh(
          new THREE.ConeGeometry(0.08*scale, 0.45*scale, 6),
          new THREE.MeshStandardMaterial({ color: i%2?0x2b7038:0x458949, roughness: 1.0 })
        );
        leaf.position.set((Math.random()-0.5)*0.12*scale, 0.34*scale, (Math.random()-0.5)*0.12*scale);
        leaf.rotation.z = (Math.random()-0.5)*0.7;
        leaf.rotation.x = (Math.random()-0.2)*0.4;
        leaf.rotation.y = Math.random()*Math.PI;
        g.add(leaf);
      }
      g.position.set(x,0,z);
      house.add(g);
      return g;
    }
    function addBush(x,z,r=0.28) {
      const bush = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), new THREE.MeshStandardMaterial({ color: 0x3b7a42, roughness: 1.0 }));
      bush.position.set(x, r*0.85, z);
      bush.castShadow = true;
      bush.receiveShadow = true;
      house.add(bush);
      return bush;
    }
    function addPalm(x,z,scale=1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08*scale, 0.12*scale, 2.6*scale, 10), new THREE.MeshStandardMaterial({ color: 0xae8e68, roughness: 1.0 }));
      trunk.position.y = 1.3*scale;
      g.add(trunk);
      for (let i=0;i<7;i++) {
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.08*scale, 0.02*scale, 1.0*scale), new THREE.MeshStandardMaterial({ color: 0x2f7b3a, roughness: 1.0 }));
        leaf.position.y = 2.6*scale;
        leaf.rotation.y = i * (Math.PI * 2 / 7);
        leaf.rotation.z = -0.6;
        leaf.position.x = Math.cos(leaf.rotation.y)*0.25*scale;
        leaf.position.z = Math.sin(leaf.rotation.y)*0.25*scale;
        g.add(leaf);
      }
      g.position.set(x,0,z);
      house.add(g);
    }
    function addSimpleCar(x,z,length,width,height,matBody,label='') {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(width, 0.38, length), matBody);
      base.position.y = 0.32;
      base.castShadow = true;
      base.receiveShadow = true;
      g.add(base);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(width*0.76, height, length*0.46), matBody);
      cabin.position.set(0, 0.78, 0.02);
      cabin.castShadow = true;
      cabin.receiveShadow = true;
      g.add(cabin);
      const glass = new THREE.Mesh(new THREE.BoxGeometry(width*0.68, height*0.74, length*0.36), matCarGlass);
      glass.position.set(0, 0.8, 0.05);
      g.add(glass);
      [[-width*0.38, 0.18, -length*0.28], [width*0.38, 0.18, -length*0.28], [-width*0.38, 0.18, length*0.28], [width*0.38, 0.18, length*0.28]].forEach(([wx,wy,wz])=>{
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.18,18), new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.9 }));
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(wx,wy,wz);
        wheel.castShadow = true;
        g.add(wheel);
      });
      const plate = box(width*0.38, 0.14, 0.02, new THREE.MeshStandardMaterial({ color: 0xf1f1f1 }), 0, 0.42, length/2 + 0.011, g, false);
      if (label) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f3f3f3'; ctx.fillRect(0,0,256,64);
        ctx.fillStyle = '#111'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, 128, 34);
        const tex = new THREE.CanvasTexture(canvas);
        plate.material.map = tex; plate.material.needsUpdate = true;
      }
      g.position.set(x,0,z);
      house.add(g);
      return g;
    }

    // Scene base
    plane(40, 40, new THREE.MeshStandardMaterial({ color: 0x6b7e69, roughness: 1.0 }), 0, 0, 4);
    const street = plane(40, 7, matStreet, 0, 0.01, -14);
    box(40, 0.2, 1.2, new THREE.MeshStandardMaterial({ color: 0xb7b0a5, roughness: 0.94 }), 0, 0.1, -10.5, house, false);

    // Plot and floors
    plane(12, 14, matIndoorFloor, 0, 0.02, 0);
    plane(5.3, 4.1, matGround, 3.35, 0.03, -4.95); // garage paving
    plane(5.2, 3.8, new THREE.MeshStandardMaterial({ color: 0x6b8f5a, roughness: 1.0 }), -3.4, 0.02, -5.1); // front garden
    plane(12, 2.2, matOutdoorFloor, 0, 0.03, 5.9); // gourmet area

    // Stepping path
    for (let i=0;i<5;i++) {
      box(0.75, 0.08, 1.0, new THREE.MeshStandardMaterial({ color: 0xcac4bb, roughness: 0.95 }), -0.8 - i*0.7, 0.06, -4.0 + i*0.8, house, false);
    }

    // Front facade / outer walls
    addWall(-6,-7,-6,7);
    addWall(6,-7,6,7);
    addWall(-6,7,6,7);
    addWall(-6,-7,-1.9,-7);
    addWall(1.2,-7,6,-7);

    // Garage envelope and facade beams
    addWall(1.1,-7,6,-7,0.65,0.24,matAccent); // garage front beam low parapet
    addWall(-6,-7,1.1,-7,0.65,0.24,matAccent); // front left beam
    box(3.2, 2.9, 0.16, matWood, 0.1, 1.45, -6.92); // pivot door plane
    box(0.1, 2.1, 0.05, matMetal, 1.05, 1.25, -6.8); // door handle

    // Tall front glass
    box(2.15, 2.8, 0.06, matGlass, -3.2, 1.4, -6.88, house, false);
    box(0.12, 2.9, 0.1, matAccent, -4.32, 1.45, -6.88);
    box(0.12, 2.9, 0.1, matAccent, -2.1, 1.45, -6.88);

    // Internal walls
    // Bathrooms and guest zone front-left
    addWall(-6,-2.7,-2.1,-2.7);
    addWall(-2.1,-2.7,-2.1,-0.5);
    addWall(-6,-0.5,-3.8,-0.5);
    addWall(-2.1,-0.5,-1.0,-0.5);
    addWall(-3.8,-2.7,-3.8,-0.5);
    addWall(-6,-2.7,-6,0.0); // outer continued already exists

    // Guest room and suite block
    addWall(-6,0.0,-2.1,0.0);
    addWall(-2.1,0.0,-2.1,3.2);
    addWall(-6,3.2,-2.1,3.2);
    addWall(-2.1,3.2,-2.1,7);
    addWall(-6,1.6,-6,7); // boundary already outer
    addWall(-2.1,3.2,0.2,3.2);
    addWall(0.2,3.2,0.2,7);

    // Ensuite bath partitions
    addWall(-2.1,7,0.2,7);
    addWall(0.2,4.6,0.2,7);

    // Laundry / service
    addWall(2.4,-2.7,4.8,-2.7);
    addWall(2.4,-2.7,2.4,0.1);
    addWall(4.8,-2.7,4.8,0.6);

    // Kitchen / rear transitions
    addWall(2.3,2.1,6,2.1);
    addWall(2.3,0.6,2.3,2.1);

    // Rear sliding door frame
    box(8.2, 2.75, 0.08, matGlass, 0.0, 1.38, 4.85, house, false);
    box(8.3, 0.08, 0.08, matMetal, 0.0, 2.76, 4.85, house, false);
    box(8.3, 0.08, 0.08, matMetal, 0.0, 0.04, 4.85, house, false);
    box(0.08, 2.8, 0.08, matMetal, -4.15, 1.4, 4.85, house, false);
    box(0.08, 2.8, 0.08, matMetal, 4.15, 1.4, 4.85, house, false);

    // Roof slabs / pergola / garage beam
    roofGroup.add(box(4.5,0.22,7.6,matAccent,-3.75,3.05,-3.2,roofGroup,false));
    roofGroup.add(box(6.0,0.22,7.0,matAccent,3.0,3.05,-3.3,roofGroup,false));
    roofGroup.add(box(12.0,0.18,2.0,new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.9 }),0,3.0,6.0,roofGroup,false));
    // Pergola beams on left half of gourmet
    for (let i=0;i<5;i++) {
      roofGroup.add(box(0.12,0.12,2.0,matAccent,-5.2 + i*1.3,2.9,6.0,roofGroup,false));
    }
    roofGroup.add(box(6.6,0.12,0.16,matAccent,-2.6,2.95,7.0,roofGroup,false));
    roofGroup.add(box(6.6,0.12,0.16,matAccent,-2.6,2.95,5.0,roofGroup,false));

    // Exterior accents
    box(12.1, 0.18, 0.22, matAccent, 0, 2.95, -7.0, house, false);
    box(5.0, 2.9, 0.12, new THREE.MeshStandardMaterial({ color: 0x7c5e45, roughness: 0.95 }), 5.94, 1.45, -4.95);
    box(0.12, 2.8, 4.0, matAccent, 6.0, 1.4, -3.0);

    // Living room
    const sofa = box(3.2,0.78,1.2,matFabric,-1.8,0.39,-1.0);
    const chaise = box(1.4,0.78,1.8,matFabric,-3.1,0.39,-0.3);
    const back1 = box(3.2,0.4,0.16,new THREE.MeshStandardMaterial({ color: 0xcfc3b0, roughness: 1.0 }),-1.8,0.85,-1.52);
    const back2 = box(1.4,0.4,0.16,new THREE.MeshStandardMaterial({ color: 0xcfc3b0, roughness: 1.0 }),-3.72,0.85,-0.3);
    addRug(4.4, 3.0, -1.2, -0.2, 0xc9bead);
    cylinder(0.75,0.75,0.28,new THREE.MeshStandardMaterial({ color: 0xd0c3af, roughness: 0.96 }),0.5,0.14,-0.1);

    // Architectural labels on floor (subtle)
    function addLabel(text, x, z, color='#222') {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = 'rgba(255,255,255,0.0)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.font = '600 42px Arial';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width/2, canvas.height/2);
      const tex = new THREE.CanvasTexture(canvas);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      spr.position.set(x, 0.6, z);
      spr.scale.set(2.1,0.5,1);
      house.add(spr);
      return spr;
    }
    addLabel('Sala', -1.1, -0.2, '#5f5348');
    addLabel('Cozinha', 3.8, 1.2, '#5f5348');
    addLabel('Suíte', -4.25, 4.1, '#5f5348');
    addLabel('Área gourmet', -1.8, 5.1, '#5f5348');

    // Preset views
    const views = {
      entrada: { pos: new THREE.Vector3(0, 2.0, -15.5), target: new THREE.Vector3(0, 1.7, -5.0), label: 'Ambiente: entrada' },
      sala: { pos: new THREE.Vector3(-0.6, 1.7, -2.3), target: new THREE.Vector3(3.2, 1.3, 1.6), label: 'Ambiente: sala integrada' },
      cozinha: { pos: new THREE.Vector3(2.3, 1.7, 0.2), target: new THREE.Vector3(4.8, 1.1, 1.4), label: 'Ambiente: cozinha americana com ilha' },
      suite: { pos: new THREE.Vector3(-3.2, 1.6, 2.3), target: new THREE.Vector3(-4.2, 1.1, 5.3), label: 'Ambiente: suíte do casal' },
      gourmet: { pos: new THREE.Vector3(-1.9, 1.7, 3.3), target: new THREE.Vector3(-2.0, 1.1, 6.1), label: 'Ambiente: área gourmet com churrasqueira' },
      banho: { pos: new THREE.Vector3(-1.25, 1.6, 4.1), target: new THREE.Vector3(-0.2, 1.1, 5.9), label: 'Ambiente: banheiro da suíte' },
      planta: { pos: new THREE.Vector3(0, 17, 0.5), target: new THREE.Vector3(0, 0, 0), label: 'Ambiente: vista superior da casa' }
    };

    function setView(key) {
      const v = views[key];
      if (!v) return;
      camera.position.copy(v.pos);
      controls.target.copy(v.target);
      controls.update();
      statusEl.textContent = v.label;
    }

    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    // Roof toggle
    let roofVisible = false;
    roofGroup.visible = roofVisible;
    const roofBtn = document.getElementById('roofBtn');
    roofBtn.textContent = 'Mostrar cobertura';
    roofBtn.addEventListener('click', () => {
      roofVisible = !roofVisible;
      roofGroup.visible = roofVisible;
      roofBtn.textContent = roofVisible ? 'Ocultar cobertura' : 'Mostrar cobertura';
    });

    document.getElementById('resetBtn').addEventListener('click', () => setView('entrada'));
    const orbitBtn = document.getElementById('orbitBtn');
    orbitBtn.addEventListener('click', () => {
      orbitEnabled = !orbitEnabled;
      controls.enabled = orbitEnabled;
      orbitBtn.textContent = `Modo órbita: ${orbitEnabled ? 'ON' : 'OFF'}`;
    });

    // Mobile navigation controls
    const held = { forward:false, back:false, left:false, right:false, turnLeft:false, turnRight:false, lookUp:false, lookDown:false, up:false, down:false };

    function bindHold(el, key) {
      const on = (e) => { e.preventDefault(); held[key] = true; el.classList.add('active'); };
      const off = (e) => { if(e) e.preventDefault(); held[key] = false; el.classList.remove('active'); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointerleave', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('touchstart', on, { passive:false });
      el.addEventListener('touchend', off, { passive:false });
    }
    document.querySelectorAll('[data-hold]').forEach(el => bindHold(el, el.dataset.hold));

    // Keyboard support
    const keyMapDown = {
      'KeyW':'forward','ArrowUp':'forward',
      'KeyS':'back','ArrowDown':'back',
      'KeyA':'left','ArrowLeft':'left',
      'KeyD':'right','ArrowRight':'right',
      'KeyQ':'turnLeft','KeyE':'turnRight',
      'PageUp':'up','PageDown':'down'
    };
    window.addEventListener('keydown', (e) => { if (keyMapDown[e.code]) held[keyMapDown[e.code]] = true; });
    window.addEventListener('keyup', (e) => { if (keyMapDown[e.code]) held[keyMapDown[e.code]] = false; });

    // Keep movement in scene bounds
    function translateView(delta) {
      camera.position.add(delta);
      controls.target.add(delta);
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -8.5, 8.5);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -17.5, 10.0);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, 1.1, 12.0);
      controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0.3, 8.0);
    }

    function rotateView(angle) {
      const vec = controls.target.clone().sub(camera.position);
      vec.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
      controls.target.copy(camera.position.clone().add(vec));
    }

    function tiltView(amount) {
      controls.target.y = THREE.MathUtils.clamp(controls.target.y + amount, 0.25, 8.5);
    }

    // Animate
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);

      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 1e-6) forward.set(0,0,1);
      forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize().negate();

      const speed = 2.8 * dt;
      if (held.forward) translateView(forward.clone().multiplyScalar(speed));
      if (held.back) translateView(forward.clone().multiplyScalar(-speed));
      if (held.left) translateView(right.clone().multiplyScalar(-speed));
      if (held.right) translateView(right.clone().multiplyScalar(speed));
      if (held.up) translateView(new THREE.Vector3(0, 2.0*dt, 0));
      if (held.down) translateView(new THREE.Vector3(0, -2.0*dt, 0));
      if (held.turnLeft) rotateView(1.5 * dt);
      if (held.turnRight) rotateView(-1.5 * dt);
      if (held.lookUp) tiltView(2.0 * dt);
      if (held.lookDown) tiltView(-2.0 * dt);

      controls.enabled = orbitEnabled;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    setView('entrada');

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
