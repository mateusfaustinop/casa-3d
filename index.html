<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Casa Moderna — Tour 3D Offline</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#b8d2e8}
.top{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:5;display:flex;gap:8px;flex-direction:column;pointer-events:none}
.card{pointer-events:auto;background:rgba(8,10,12,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:17px;padding:11px 12px;box-shadow:0 10px 35px rgba(0,0,0,.28)}
.title{font-size:16px;font-weight:750;margin-bottom:3px}.sub{font-size:11px;color:#d6d9dc;line-height:1.28}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.11);color:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:650}
button:active{transform:scale(.97);background:rgba(255,255,255,.2)}
#badge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(188px + env(safe-area-inset-bottom));z-index:5;background:rgba(8,10,12,.72);border:1px solid rgba(255,255,255,.16);padding:7px 11px;border-radius:999px;font-size:11px;white-space:nowrap;backdrop-filter:blur(12px)}
.controls{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:7px;pointer-events:auto}.look{display:grid;grid-template-columns:58px 58px;grid-template-rows:54px 54px;gap:7px;pointer-events:auto}
.ctrl{border-radius:17px;background:rgba(8,10,12,.68);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;backdrop-filter:blur(12px);user-select:none}.ctrl.on{background:rgba(255,255,255,.22)}.ghost{opacity:0;pointer-events:none}
#hint{position:fixed;right:12px;top:48%;z-index:4;background:rgba(8,10,12,.55);padding:7px 9px;border-radius:12px;font-size:10px;color:#eee;pointer-events:none}
@media(min-width:760px){.top{max-width:620px}.pad{grid-template-columns:62px 62px 62px;grid-template-rows:62px 62px 62px}.look{grid-template-columns:64px 64px;grid-template-rows:62px 62px}#badge{bottom:215px}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="top">
  <div class="card">
    <div class="title">Casa Moderna — Tour 3D</div>
    <div class="sub">Versão offline para iPhone/Android. Arraste a imagem para olhar ao redor e use os controles para caminhar.</div>
  </div>
  <div class="card">
    <div class="buttons">
      <button data-v="entrada">Entrada</button><button data-v="sala">Sala</button><button data-v="cozinha">Cozinha</button><button data-v="suite">Suíte</button><button data-v="banho">Banheiro suíte</button><button data-v="gourmet">Área gourmet</button><button data-v="planta">Vista superior</button><button id="roof">Mostrar cobertura</button><button id="labels">Ocultar nomes</button>
    </div>
  </div>
</div>
<div id="hint">arraste para olhar</div>
<div id="badge">Ambiente: entrada</div>
<div class="controls">
  <div class="pad">
    <div class="ghost"></div><div class="ctrl" data-h="f">▲</div><div class="ghost"></div>
    <div class="ctrl" data-h="l">◀</div><div class="ctrl" data-h="b">▼</div><div class="ctrl" data-h="r">▶</div>
    <div class="ghost"></div><div class="ctrl" data-h="up">＋</div><div class="ctrl" data-h="down">−</div>
  </div>
  <div class="look">
    <div class="ctrl" data-h="tl">↺</div><div class="ctrl" data-h="tr">↻</div>
    <div class="ctrl" data-h="lu">⬆</div><div class="ctrl" data-h="ld">⬇</div>
  </div>
</div>
<script>
(()=>{
'use strict';
const c=document.getElementById('view'),ctx=c.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const objs=[],labels=[];let roofVisible=false,labelsVisible=true;
const cam={x:0,y:1.75,z:-15,yaw:0,pitch:-.02,fov:72};
const held={f:0,b:0,l:0,r:0,tl:0,tr:0,lu:0,ld:0,up:0,down:0};
const badge=document.getElementById('badge');
const C={wall:'#e8e0d4',accent:'#202328',wood:'#7d583e',floor:'#d9d0c3',out:'#c6beb2',marble:'#141518',fabric:'#d8cfbf',green:'#35673a',glass:'rgba(151,189,214,.42)',stone:'#cfc2ae',metal:'#30343a',white:'#f3f0ea',blue:'#183a67',grey:'#777a76',street:'#3b3d40',lawn:'#5d8055'};
function addBox(x,y,z,w,h,d,color,opt={}){objs.push({type:'box',x,y,z,w,h,d,color,roof:!!opt.roof,alpha:opt.alpha??1,em:opt.em??0})}
function addLabel(t,x,y,z){labels.push({t,x,y,z})}
function wall(x,z,w,d,h=2.9,color=C.wall){addBox(x,h/2,z,w,h,d,color)}
function cubeFaces(o){const x=o.x,y=o.y,z=o.z,w=o.w/2,h=o.h/2,d=o.d/2;const v=[[-w,-h,-d],[w,-h,-d],[w,h,-d],[-w,h,-d],[-w,-h,d],[w,-h,d],[w,h,d],[-w,h,d]].map(p=>[p[0]+x,p[1]+y,p[2]+z]);return [
{v:[v[0],v[1],v[2],v[3]],s:.72},{v:[v[5],v[4],v[7],v[6]],s:1.02},{v:[v[4],v[0],v[3],v[7]],s:.82},{v:[v[1],v[5],v[6],v[2]],s:.9},{v:[v[3],v[2],v[6],v[7]],s:1.1},{v:[v[4],v[5],v[1],v[0]],s:.58}
]}
function hexToRgb(h){if(h.startsWith('rgba'))return null;h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(color,s,a=1){if(color.startsWith('rgba'))return color;const rgb=hexToRgb(color);return `rgba(${Math.min(255,rgb[0]*s)|0},${Math.min(255,rgb[1]*s)|0},${Math.min(255,rgb[2]*s)|0},${a})`}
function tr(p){let dx=p[0]-cam.x,dy=p[1]-cam.y,dz=p[2]-cam.z;const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);let x=cy*dx-sy*dz,z=sy*dx+cy*dz;const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);let y=cp*dy-sp*z,zz=sp*dy+cp*z;return[x,y,zz]}
function proj(p){const q=tr(p);if(q[2]<.08)return null;const f=(H*.5)/Math.tan(cam.fov*Math.PI/360);return[W*.5+q[0]*f/q[2],H*.5-q[1]*f/q[2],q[2]]}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8dbbe4');g.addColorStop(.55,'#dbe6e8');g.addColorStop(1,'#7b8b73');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function render(){drawSky();const faces=[];for(const o of objs){if(o.roof&&!roofVisible)continue;for(const f of cubeFaces(o)){const pp=f.v.map(proj);if(pp.some(x=>!x))continue;const depth=pp.reduce((s,p)=>s+p[2],0)/pp.length;faces.push({pp,depth,fill:shade(o.color,f.s,o.alpha)})}}faces.sort((a,b)=>b.depth-a.depth);for(const f of faces){ctx.beginPath();ctx.moveTo(f.pp[0][0],f.pp[0][1]);for(let i=1;i<f.pp.length;i++)ctx.lineTo(f.pp[i][0],f.pp[i][1]);ctx.closePath();ctx.fillStyle=f.fill;ctx.fill();ctx.strokeStyle='rgba(20,20,20,.14)';ctx.lineWidth=.55;ctx.stroke()}
if(labelsVisible){ctx.textAlign='center';ctx.font='600 11px -apple-system,Arial';for(const l of labels){const p=proj([l.x,l.y,l.z]);if(!p||p[2]>22)continue;const a=Math.max(.2,1-p[2]/26);ctx.fillStyle=`rgba(25,22,20,${a})`;ctx.fillText(l.t,p[0],p[1])}}
}
// terreno, rua e pisos
addBox(0,-.18,2,28,.3,28,'#71826a');addBox(0,-.04,-13.4,28,.08,6.2,C.street);addBox(0,.01,0,12,.08,14,C.floor);addBox(3.5,.03,-5.0,5.0,.1,4.0,'#777875');addBox(-3.5,.02,-5.0,4.6,.09,3.8,C.lawn);addBox(0,.04,6.0,12,.1,2.0,C.out);
// fachada e externos
wall(-5.9,0,.18,14);wall(5.9,0,.18,14);wall(0,6.9,12,.18);wall(-4,-6.9,4,.18);wall(3.6,-6.9,4.6,.18);addBox(0.0,1.45,-6.82,2.65,2.8,.11,C.wood);addBox(-3.25,1.43,-6.83,2.15,2.75,.06,C.glass,{alpha:.5});addBox(0,2.95,-6.87,12,.22,.22,C.accent,{roof:true});
// garagem e marquise
addBox(3.4,3.02,-3.5,5.0,.2,7.0,C.accent,{roof:true});addBox(-3.45,3.02,-3.45,4.8,.2,7.0,C.accent,{roof:true});
// divisões internas — banheiro/lavabo e quartos
wall(-4.0,-2.65,3.8,.16);wall(-2.05,-1.6,.16,2.25);wall(-4.9,-.52,2.05,.16);wall(-2.65,-.52,.95,.16);wall(-3.8,-1.6,.16,2.1);
wall(-4.0,.05,3.8,.16);wall(-2.05,1.6,.16,3.1);wall(-4.0,3.2,3.8,.16);wall(-2.05,5.05,.16,3.6);wall(-.85,3.2,2.4,.16);wall(.25,5.1,.16,3.7);
// lavanderia
wall(3.55,-2.65,2.5,.16);wall(2.3,-1.25,.16,2.8);wall(4.8,-1.0,.16,3.3);
// cozinha / fundos
wall(4.15,2.15,3.5,.16);wall(2.35,1.4,.16,1.5);addBox(0,1.4,4.8,8.3,2.65,.05,C.glass,{alpha:.45});
// sala
addBox(-1.8,.38,-1.1,3.2,.76,1.15,C.fabric);addBox(-3.15,.38,-.35,1.3,.76,1.9,C.fabric);addBox(-1.8,.83,-1.62,3.2,.36,.14,'#c5b8a5');addBox(-3.78,.83,-.35,.14,.36,1.9,'#c5b8a5');addBox(-1.25,.055,-.2,4.2,.05,2.9,'#c9bead');addBox(.4,.17,-.1,1.35,.3,1.0,C.stone);addBox(1.92,.9,-1.05,.18,1.8,2.25,C.wood);addBox(2.04,1.42,-1.05,.05,1.18,1.72,'#111316');
// jantar
addBox(-.65,.42,2.1,1.25,.76,3.15,C.marble);for(let i=0;i<3;i++){addBox(-1.6+i*.95,.26,1.18,.56,.5,.55,'#b88b66');addBox(-1.6+i*.95,.26,3.02,.56,.5,.55,'#b88b66')}
// cozinha americana + ilha
addBox(3.22,.46,1.85,1.25,.9,3.65,C.marble);addBox(5.12,.44,1.85,.7,.85,3.4,C.marble);addBox(5.08,1.05,.25,.78,2.05,.78,'#969a9a');addBox(4.52,.45,.9,2.4,.88,.6,C.wood);for(let i=0;i<4;i++)addBox(2.55,.34,.45+i*.88,.56,.68,.56,'#2a2c2e');
// lavanderia
addBox(3.55,.45,-1.55,.85,.85,1.25,C.stone);addBox(4.45,.44,-1.8,.7,.86,.7,C.white);addBox(5.18,.44,-1.8,.7,.86,.7,C.white);
// quarto hóspedes
addBox(-4.1,.24,1.55,1.65,.46,2.2,'#b6b9bd');addBox(-4.1,.58,.5,1.65,.58,.18,'#958779');addBox(-4.1,.055,1.55,2.2,.05,2.8,'#c9c0b3');addBox(-2.75,.95,2.2,1.0,1.9,.55,'#8d7056');
// banheiro social e lavabo
addBox(-4.95,.43,-1.55,1.45,.85,.55,C.stone);addBox(-5.0,.42,-.42,.82,.8,.82,C.white);addBox(-5.83,1.1,-1.55,.12,2.15,1.55,C.glass,{alpha:.4});addBox(-2.95,.41,-1.55,.82,.8,.7,C.white);addBox(-2.95,.43,-2.15,.95,.84,.48,C.stone);
// suíte casal
addBox(-4.05,.28,5.25,2.6,.52,2.7,'#e7ddce');addBox(-4.05,.72,6.47,2.75,.7,.22,'#c5b39d');addBox(-4.05,.17,3.55,1.85,.3,.72,'#d6cab9');addBox(-4.05,.055,4.95,3.8,.05,3.4,'#c8beaf');addBox(-5.82,1.45,3.45,.16,1.2,1.8,'#141619');addBox(-4.8,1.25,6.88,2.15,2.35,.05,C.glass,{alpha:.42});
// banheiro suíte
addBox(-.98,.43,5.22,1.75,.85,.58,C.stone);addBox(-.05,.42,5.45,.82,.8,.82,C.white);addBox(.12,1.08,6.02,.1,2.12,1.88,C.glass,{alpha:.4});addBox(-.85,1.45,6.88,1.6,.08,.08,C.metal);
// gourmet
addBox(-2.1,.39,6.0,1.1,.74,2.75,C.marble);for(let i=0;i<3;i++){addBox(-3.05+i*.95,.26,5.08,.56,.5,.56,'#9f8873');addBox(-3.05+i*.95,.26,6.92,.56,.5,.56,'#9f8873')}addBox(.15,1.15,6.0,.25,2.3,2.0,C.marble);addBox(.4,1.5,6.02,1.85,.1,.1,C.metal);addBox(1.75,.45,5.25,1.25,.88,.62,C.marble);addBox(2.35,.44,5.18,.68,.86,.68,'#27292b');addBox(-4.55,.4,5.85,2.65,.76,.9,'#c5baa8');addBox(-4.55,.15,4.5,1.1,.28,1.1,C.marble);
// cobertura gourmet 50%
addBox(-2.75,2.98,6.0,6.4,.17,2.0,C.white,{roof:true});for(let i=0;i<5;i++)addBox(-5.2+i*1.25,2.91,6.0,.1,.12,2.1,C.accent,{roof:true});
// vegetação em blocos de tamanhos variados
function plant(x,z,s=.3){addBox(x,s*.45,z,s,s*.9,s,C.green)}for(let x=-5.5;x<5.6;x+=.7)plant(x,7.25,.28+Math.random()*.16);for(let z=5;z<7.2;z+=.5){plant(-6.05,z,.3);plant(6.05,z,.28)}for(let x=-5.3;x<-1.3;x+=.65)plant(x,-5.9,.32);plant(-4.9,-4.65,.75);plant(-3.6,-4.2,.45);plant(-1.2,-4.35,.48);plant(5.15,-3.45,.5);plant(-5.5,4.35,.42);plant(2.1,6.75,.38);
// carros simplificados — Boreal + 208 azul escuro
function car(x,z,w,d,h,col){addBox(x,.28,z,w,.42,d,col);addBox(x,.72,z,w*.74,h,d*.48,col);addBox(x,.82,z,w*.62,h*.6,d*.33,'#7190a5');for(const sx of[-1,1])for(const sz of[-1,1])addBox(x+sx*w*.42,.2,z+sz*d*.3,.18,.38,.42,'#1a1c1f')}
car(2.85,-4.85,1.75,3.45,.72,C.grey);car(4.95,-4.85,1.58,3.0,.65,C.blue);
// labels
addLabel('SALA',-1.1,.65,-.15);addLabel('JANTAR',-.65,.65,2.1);addLabel('COZINHA',3.7,.7,1.0);addLabel('SUÍTE',-4.05,.7,4.2);addLabel('HÓSPEDES',-4.05,.7,1.55);addLabel('ÁREA GOURMET',-2.1,.7,5.0);addLabel('BWC SUÍTE',-.7,.7,5.9);addLabel('GARAGEM',4.0,.7,-5.5);
const views={entrada:[0,1.78,-15,0,-.02,'Ambiente: entrada'],sala:[-.3,1.65,-2.8,.55,-.04,'Ambiente: sala integrada'],cozinha:[1.65,1.65,.2,.7,-.06,'Ambiente: cozinha americana'],suite:[-3.1,1.6,2.55,-.28,-.04,'Ambiente: suíte do casal'],banho:[-1.6,1.55,4.25,.45,-.06,'Ambiente: banheiro da suíte'],gourmet:[-2.0,1.65,3.25,.02,-.05,'Ambiente: área gourmet'],planta:[0,15,.3,0,-1.48,'Ambiente: vista superior']};
function view(k){const v=views[k];[cam.x,cam.y,cam.z,cam.yaw,cam.pitch]=v;badge.textContent=v[5]}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
document.getElementById('roof').onclick=e=>{roofVisible=!roofVisible;e.currentTarget.textContent=roofVisible?'Ocultar cobertura':'Mostrar cobertura'};document.getElementById('labels').onclick=e=>{labelsVisible=!labelsVisible;e.currentTarget.textContent=labelsVisible?'Ocultar nomes':'Mostrar nomes'};
function bind(el,k){const on=e=>{e.preventDefault();held[k]=1;el.classList.add('on')},off=e=>{if(e)e.preventDefault();held[k]=0;el.classList.remove('on')};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}document.querySelectorAll('[data-h]').forEach(e=>bind(e,e.dataset.h));
let dragging=false,lx=0,ly=0;c.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;cam.yaw-=dx*.006;cam.pitch=Math.max(-1.5,Math.min(1.15,cam.pitch-dy*.0055))});c.addEventListener('pointerup',()=>dragging=false);c.addEventListener('pointercancel',()=>dragging=false);
let last=performance.now();function tick(t){const dt=Math.min((t-last)/1000,.033);last=t;const sp=2.7*dt,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);if(held.f){cam.x+=sy*sp;cam.z+=cy*sp}if(held.b){cam.x-=sy*sp;cam.z-=cy*sp}if(held.l){cam.x-=cy*sp;cam.z+=sy*sp}if(held.r){cam.x+=cy*sp;cam.z-=sy*sp}if(held.tl)cam.yaw+=1.6*dt;if(held.tr)cam.yaw-=1.6*dt;if(held.lu)cam.pitch=Math.max(-1.5,cam.pitch-1.1*dt);if(held.ld)cam.pitch=Math.min(1.15,cam.pitch+1.1*dt);if(held.up)cam.y=Math.min(15,cam.y+2.1*dt);if(held.down)cam.y=Math.max(.7,cam.y-2.1*dt);cam.x=Math.max(-8.5,Math.min(8.5,cam.x));cam.z=Math.max(-17,Math.min(9.5,cam.z));render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script>
</body></html>
